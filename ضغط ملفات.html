<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ضاغط الصور الذكي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #fff;
      padding: 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; padding: 40px 0 30px; }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(168,85,247,0.3);
    }
    .logo svg { width: 40px; height: 40px; }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #d8b4fe, #f9a8d4, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #94a3b8; font-size: 1.1rem; }

    .drop-zone {
      border: 2px dashed rgba(168,85,247,0.4);
      border-radius: 24px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(30,41,59,0.5);
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #a855f7;
      background: rgba(168,85,247,0.08);
    }
    .drop-zone .icon-box {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.2));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .drop-zone p { color: #e2e8f0; font-size: 1.2rem; font-weight: 600; }
    .drop-zone span { color: #64748b; font-size: 0.9rem; }

    .settings {
      background: rgba(30,41,59,0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(100,116,139,0.3);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }
    .setting-group { display: flex; align-items: center; gap: 10px; }
    .setting-group label { color: #cbd5e1; font-weight: 500; white-space: nowrap; }
    input[type="range"] {
      width: 140px;
      accent-color: #a855f7;
    }
    .quality-val { color: #c084fc; font-weight: bold; min-width: 40px; }
    select {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 12px;
      color: #fff;
      font-size: 0.95rem;
    }

    .results { display: none; }
    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .results-header h2 { font-size: 1.5rem; }
    .btn-download-all {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }
    .btn-download-all:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124,58,237,0.4); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card {
      background: rgba(30,41,59,0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(100,116,139,0.3);
      display: flex; gap: 14px;
    }
    .card-img-wrap { position: relative; flex-shrink: 0; }
    .card-img-wrap img {
      width: 100px; height: 100px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(100,116,139,0.4);
    }
    .badge {
      position: absolute; top: -8px; right: -8px;
      background: #22c55e;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-info h4 { color: #f1f5f9; font-size: 0.95rem; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 3px; }
    .row .label { color: #94a3b8; }
    .row .val { color: #e2e8f0; }
    .row .val.green { color: #4ade80; font-weight: 600; }
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(124,58,237,0.8);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-dl:hover { background: rgba(124,58,237,1); }

    .stats {
      display: none;
      margin-top: 24px;
      background: linear-gradient(90deg, rgba(88,28,135,0.4), rgba(131,24,67,0.4));
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(168,85,247,0.2);
    }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center; }
    .stat-label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 6px; }
    .stat-val { font-size: 1.6rem; font-weight: bold; }
    .stat-val.white { color: #f8fafc; }
    .stat-val.green { color: #4ade80; }
    .stat-val.purple { color: #c084fc; }

    .progress-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .progress-overlay.active { display: flex; }
    .progress-box {
      background: #1e293b;
      padding: 32px 48px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(168,85,247,0.3);
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(168,85,247,0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .settings { flex-direction: column; align-items: flex-start; }
      .stats-grid { grid-template-columns: 1fr; }
      .card { flex-direction: column; }
      .card-img-wrap img { width: 100%; height: 180px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <div class="spinner"></div>
      <p style="color:#e2e8f0;font-size:1.1rem;">جاري ضغط الصور...</p>
      <p style="color:#94a3b8;font-size:0.9rem;margin-top:8px;" id="progressText">0 / 0</p>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1>ضاغط الصور الذكي</h1>
      <p class="subtitle">ضغط ذكي بدون فقدان الجودة — يشتغل كلياً على متصفحك</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div class="icon-box">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
      </div>
      <p>اسحب الصور هنا أو انقر للاختيار</p>
      <span>PNG, JPG, WEBP — حتى 20 صورة معاً</span>
    </div>

    <div class="settings">
      <div class="setting-group">
        <label>جودة الضغط:</label>
        <input type="range" id="qualityRange" min="10" max="95" value="80">
        <span class="quality-val" id="qualityValue">80%</span>
      </div>
      <div class="setting-group">
        <label>الصيغة:</label>
        <select id="formatSelect">
          <option value="auto">تلقائي (أفضل)</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="setting-group">
        <label>العرض الأقصى:</label>
        <select id="maxWidthSelect">
          <option value="0">بدون تغيير</option>
          <option value="1920">1920px</option>
          <option value="1280" selected>1280px</option>
          <option value="800">800px</option>
          <option value="640">640px</option>
        </select>
      </div>
    </div>

    <div class="results" id="resultsSection">
      <div class="results-header">
        <h2>النتائج</h2>
        <button class="btn-download-all" id="downloadAllBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          تحميل الكل
        </button>
      </div>
      <div class="grid" id="resultsGrid"></div>
    </div>

    <div class="stats" id="statsSection">
      <div class="stats-grid">
        <div>
          <div class="stat-label">الحجم الأصلي</div>
          <div class="stat-val white" id="totalOriginal">0 MB</div>
        </div>
        <div>
          <div class="stat-label">الحجم بعد الضغط</div>
          <div class="stat-val green" id="totalCompressed">0 MB</div>
        </div>
        <div>
          <div class="stat-label">نسبة التوفير</div>
          <div class="stat-val purple" id="totalSaved">0%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const qualityRange = document.getElementById('qualityRange');
    const qualityValue = document.getElementById('qualityValue');
    const formatSelect = document.getElementById('formatSelect');
    const maxWidthSelect = document.getElementById('maxWidthSelect');
    const resultsSection = document.getElementById('resultsSection');
    const resultsGrid = document.getElementById('resultsGrid');
    const statsSection = document.getElementById('statsSection');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const progressOverlay = document.getElementById('progressOverlay');
    const progressText = document.getElementById('progressText');

    let compressedImages = [];

    qualityRange.addEventListener('input', () => qualityValue.textContent = qualityRange.value + '%');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', e => handleFiles(e.target.files));

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B','KB','MB','GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function handleFiles(files) {
      const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!imageFiles.length) return;

      compressedImages = [];
      resultsGrid.innerHTML = '';
      resultsSection.style.display = 'block';
      statsSection.style.display = 'block';
      progressOverlay.classList.add('active');

      let totalOriginal = 0, totalCompressed = 0;

      for (let i = 0; i < imageFiles.length; i++) {
        progressText.textContent = (i + 1) + ' / ' + imageFiles.length;
        const result = await compressImage(imageFiles[i], i);
        compressedImages.push(result);
        totalOriginal += result.originalSize;
        totalCompressed += result.compressedSize;
      }

      progressOverlay.classList.remove('active');
      document.getElementById('totalOriginal').textContent = formatSize(totalOriginal);
      document.getElementById('totalCompressed').textContent = formatSize(totalCompressed);
      const saved = totalOriginal > 0 ? ((totalOriginal - totalCompressed) / totalOriginal * 100).toFixed(1) : 0;
      document.getElementById('totalSaved').textContent = saved + '%';
    }

    function compressImage(file, index) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            let w = img.width, h = img.height;
            const maxW = parseInt(maxWidthSelect.value);
            if (maxW > 0 && w > maxW) { h = (h * maxW) / w; w = maxW; }

            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);

            const quality = parseInt(qualityRange.value) / 100;
            let fmt = formatSelect.value;
            if (fmt === 'auto') fmt = file.type === 'image/png' ? 'image/png' : 'image/jpeg';

            let finalQ = quality;
            if (file.size > 2 * 1024 * 1024 && fmt === 'image/jpeg') finalQ = Math.min(quality, 0.75);

            canvas.toBlob(blob => {
              const url = URL.createObjectURL(blob);
              const orig = file.size;
              const comp = blob.size;
              const saved = ((orig - comp) / orig * 100).toFixed(1);

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="card-img-wrap">
                  <img src="${url}" alt="${file.name}">
                  <div class="badge">-${saved}%</div>
                </div>
                <div class="card-info">
                  <h4>${file.name}</h4>
                  <div class="row"><span class="label">الأصلي:</span><span class="val">${formatSize(orig)}</span></div>
                  <div class="row"><span class="label">بعد الضغط:</span><span class="val green">${formatSize(comp)}</span></div>
                  <div class="row"><span class="label">الأبعاد:</span><span class="val">${Math.round(w)}×${Math.round(h)}</span></div>
                  <a href="${url}" download="compressed_${file.name}" class="btn-dl">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    تحميل
                  </a>
                </div>
              `;
              resultsGrid.appendChild(card);
              resolve({ url, name: file.name, originalSize: orig, compressedSize: comp, blob });
            }, fmt, finalQ);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    downloadAllBtn.addEventListener('click', async () => {
      if (!compressedImages.length) return;
      for (const img of compressedImages) {
        const a = document.createElement('a');
        a.href = img.url; a.download = 'compressed_' + img.name; a.click();
        await new Promise(r => setTimeout(r, 300));
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
