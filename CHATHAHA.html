<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات USB - WebUSB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0e17;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 550px;
            width: 100%;
            background: linear-gradient(145deg, #141b2b, #0f1624);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            font-size: 28px;
        }
        
        .logo-text {
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .badge {
            background: rgba(0, 210, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            color: #00d2ff;
        }
        
        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status-box.disconnected {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .status-box.connected {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        
        .status-box.waiting {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.2);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-dot.red { background: #ef4444; }
        .status-dot.green { background: #22c55e; animation: pulse 1.5s infinite; }
        .status-dot.yellow { background: #eab308; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .chat-area {
            height: 340px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            padding: 16px;
            overflow-y: auto;
            margin: 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #2a3a5a;
            border-radius: 10px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .msg {
            margin-bottom: 10px;
            padding: 10px 16px;
            border-radius: 14px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeUp 0.2s ease;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg.sent {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .msg.received {
            background: rgba(255, 255, 255, 0.06);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        
        .msg.system {
            background: rgba(234, 179, 8, 0.08);
            color: #eab308;
            margin: 6px auto;
            text-align: center;
            max-width: 95%;
            font-size: 12px;
            padding: 6px 14px;
            border: 1px solid rgba(234, 179, 8, 0.1);
            border-radius: 20px;
        }
        
        .msg.error {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
            margin: 6px auto;
            text-align: center;
            max-width: 95%;
            font-size: 12px;
            padding: 6px 14px;
            border: 1px solid rgba(239, 68, 68, 0.1);
            border-radius: 20px;
        }
        
        .msg img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .msg .time {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            margin-top: 4px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 15px;
            transition: all 0.2s;
            min-width: 0;
        }
        
        .input-row input:focus {
            outline: none;
            border-color: #2563eb;
            background: rgba(0, 0, 0, 0.6);
        }
        
        .input-row input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .input-row input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .btn {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
        }
        
        .btn-success:hover:not(:disabled) {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .file-area {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .file-label {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.6);
            touch-action: manipulation;
        }
        
        .file-label:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }
        
        .file-label:active {
            transform: scale(0.97);
        }
        
        .file-label input[type="file"] {
            display: none;
        }
        
        .file-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .btn-clear-file {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: all 0.2s;
        }
        
        .btn-clear-file:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .btn-clear-file.show {
            display: flex;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .button-row .btn {
            flex: 1;
            min-width: 80px;
            text-align: center;
        }
        
        .info-bar {
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .info-bar code {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 6px;
            color: #00d2ff;
            font-size: 11px;
        }
        
        @media (max-width: 500px) {
            .container { padding: 16px; border-radius: 20px; }
            .chat-area { height: 260px; }
            .input-row { flex-direction: column; }
            .btn { padding: 12px; font-size: 14px; }
            .logo-text { font-size: 16px; }
            .button-row .btn { min-width: 60px; font-size: 13px; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <span class="logo-icon">🔌</span>
            <span class="logo-text">USB Chat</span>
            <span class="badge">WebUSB</span>
        </div>
        <div class="status-box disconnected" id="statusBox">
            <span class="status-dot red" id="statusDot"></span>
            <span id="statusText">غير متصل</span>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="msg system">🚀 شات USB حقيقي عبر WebUSB</div>
        <div class="msg system">📌 اضغط "اتصال" لبدء المحادثة</div>
        <div class="msg system">💡 يدعم النصوص والصور والملفات</div>
    </div>

    <!-- Input -->
    <div class="input-row">
        <input type="text" id="msgInput" placeholder="اكتب رسالة..." disabled>
        <button class="btn btn-primary" id="sendBtn" disabled>إرسال</button>
    </div>

    <!-- File Upload -->
    <div class="file-area">
        <label class="file-label" id="fileLabel">
            📎 اختيار ملف
            <input type="file" id="fileInput" disabled>
        </label>
        <span class="file-name" id="fileName">لا يوجد ملف</span>
        <button class="btn-clear-file" id="clearFileBtn">✕</button>
    </div>

    <!-- Buttons -->
    <div class="button-row">
        <button class="btn btn-success" id="connectBtn">🔗 اتصال</button>
        <button class="btn btn-danger" id="disconnectBtn" style="display:none;">⛔ قطع</button>
        <button class="btn btn-outline" id="listBtn">📋 منافذ</button>
    </div>

    <!-- Info -->
    <div class="info-bar">
        💡 <b>طريقة الاستخدام:</b> اضغط <code>اتصال</code> ← اختر جهاز USB ← ابدأ بالكتابة
        <span style="display:block;margin-top:4px;">⚠️ يتطلب <b>Chrome 89+</b> أو <b>Edge 89+</b></span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ======== DOM ========
        const chatArea = document.getElementById('chatArea');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const listBtn = document.getElementById('listBtn');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const clearFileBtn = document.getElementById('clearFileBtn');
        const statusBox = document.getElementById('statusBox');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ======== State ========
        let usbDevice = null;
        let usbInterface = null;
        let usbEndpointIn = null;
        let usbEndpointOut = null;
        let isConnected = false;
        let isReading = false;
        let selectedFile = null;
        let deviceInfo = '';

        // ======== Helpers ========
        function getTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' +
                   d.getMinutes().toString().padStart(2, '0');
        }

        function addMessage(text, type = 'system') {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerHTML = text + '<span class="time">' + getTime() + '</span>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addImageMessage(imgData, type = 'received') {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerHTML = '<img src="' + imgData + '" alt="صورة">' +
                           '<span class="time">' + getTime() + '</span>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function setStatus(text, state = 'disconnected') {
            statusText.textContent = text;
            statusBox.className = 'status-box ' + state;
            const dot = document.getElementById('statusDot');
            if (state === 'connected') {
                dot.className = 'status-dot green';
            } else if (state === 'waiting') {
                dot.className = 'status-dot yellow';
            } else {
                dot.className = 'status-dot red';
            }
        }

        function updateUI(connected) {
            isConnected = connected;
            msgInput.disabled = !connected;
            sendBtn.disabled = !connected;
            fileInput.disabled = !connected;
            connectBtn.style.display = connected ? 'none' : 'inline-block';
            disconnectBtn.style.display = connected ? 'inline-block' : 'none';
            
            if (connected) {
                setStatus('متصل: ' + deviceInfo, 'connected');
                msgInput.focus();
            } else {
                setStatus('غير متصل', 'disconnected');
                deviceInfo = '';
            }
        }

        // ======== USB Functions ========
        async function connectUSB() {
            try {
                if (!navigator.usb) {
                    addMessage('❌ متصفحك لا يدعم WebUSB', 'error');
                    addMessage('💡 استخدم Chrome أو Edge الإصدار 89+', 'system');
                    return;
                }

                addMessage('🔍 جاري البحث عن أجهزة USB...', 'system');
                setStatus('جاري البحث...', 'waiting');

                usbDevice = await navigator.usb.requestDevice({
                    filters: []
                });

                if (!usbDevice) {
                    addMessage('❌ لم يتم اختيار أي جهاز', 'error');
                    setStatus('غير متصل', 'disconnected');
                    return;
                }

                deviceInfo = usbDevice.productName || 'جهاز USB';
                addMessage('✅ تم اختيار: ' + deviceInfo, 'system');

                await usbDevice.open();

                if (usbDevice.configuration === null) {
                    await usbDevice.selectConfiguration(1);
                }

                // العثور على واجهة مناسبة
                const interfaces = usbDevice.configuration.interfaces;
                let found = false;

                for (const iface of interfaces) {
                    for (const alt of iface.alternates) {
                        if (alt.endpoints.length >= 2) {
                            usbInterface = alt;
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }

                if (!found) {
                    // استخدم أول واجهة
                    usbInterface = usbDevice.configuration.interfaces[0].alternates[0];
                    if (!usbInterface) {
                        throw new Error('لا توجد واجهة USB مناسبة');
                    }
                }

                await usbDevice.claimInterface(usbInterface.interfaceNumber);

                // تحديد نقاط النهاية
                for (const endpoint of usbInterface.endpoints) {
                    if (endpoint.direction === 'in') {
                        usbEndpointIn = endpoint;
                    } else if (endpoint.direction === 'out') {
                        usbEndpointOut = endpoint;
                    }
                }

                if (!usbEndpointIn || !usbEndpointOut) {
                    throw new Error('تعذر العثور على نقاط نهاية USB');
                }

                addMessage('🔌 تم الاتصال بنجاح!', 'system');
                addMessage('📨 جاهز للإرسال والاستقبال', 'system');

                updateUI(true);
                startReading();

            } catch (error) {
                console.error('خطأ في الاتصال:', error);
                addMessage('❌ خطأ: ' + error.message, 'error');
                setStatus('غير متصل', 'disconnected');
                usbDevice = null;
            }
        }

        async function startReading() {
            if (isReading || !usbDevice || !usbEndpointIn) return;
            isReading = true;

            try {
                while (isConnected && usbDevice) {
                    try {
                        const result = await usbDevice.transferIn(usbEndpointIn.endpointNumber, 4096);

                        if (result.data && result.data.byteLength > 0) {
                            const data = new TextDecoder().decode(result.data);
                            const lines = data.split('\n');
                            for (const line of lines) {
                                if (line.trim()) {
                                    if (line.startsWith('data:image')) {
                                        addImageMessage(line, 'received');
                                    } else {
                                        addMessage('📩 ' + line, 'received');
                                    }
                                }
                            }
                        }
                    } catch (err) {
                        if (err.message && err.message.includes('disconnected')) {
                            break;
                        }
                        console.warn('خطأ في القراءة:', err);
                    }
                }
            } catch (error) {
                console.error('خطأ في حلقة القراءة:', error);
            } finally {
                isReading = false;
            }
        }

        async function sendUSBData(data) {
            if (!isConnected || !usbDevice || !usbEndpointOut) {
                addMessage('❌ غير متصل بـ USB', 'error');
                return false;
            }

            try {
                const encoder = new TextEncoder();
                const encodedData = encoder.encode(data + '\n');
                await usbDevice.transferOut(usbEndpointOut.endpointNumber, encodedData);
                return true;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                addMessage('❌ فشل الإرسال: ' + error.message, 'error');
                return false;
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();

            if (!text && !selectedFile) {
                addMessage('⚠️ اكتب رسالة أو اختر ملف', 'system');
                return;
            }

            // إرسال النص
            if (text) {
                const success = await sendUSBData(text);
                if (success) {
                    addMessage('📤 ' + text, 'sent');
                    msgInput.value = '';
                }
            }

            // إرسال الملف
            if (selectedFile) {
                try {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        const base64 = e.target.result;
                        // إرسال على أجزاء إذا كان كبيراً
                        const chunkSize = 1024;
                        const data = base64;
                        const success = await sendUSBData(data);
                        if (success) {
                            addMessage('📎 تم إرسال: ' + selectedFile.name, 'sent');
                            selectedFile = null;
                            fileInput.value = '';
                            fileName.textContent = 'لا يوجد ملف';
                            fileName.style.color = 'rgba(255,255,255,0.4)';
                            clearFileBtn.classList.remove('show');
                        }
                    };
                    reader.readAsDataURL(selectedFile);
                } catch (err) {
                    addMessage('❌ فشل إرسال الملف: ' + err.message, 'error');
                }
            }
        }

        async function disconnectUSB() {
            isConnected = false;
            isReading = false;

            if (usbDevice) {
                try {
                    if (usbInterface) {
                        await usbDevice.releaseInterface(usbInterface.interfaceNumber);
                    }
                    await usbDevice.close();
                } catch (err) {
                    console.warn('خطأ في قطع الاتصال:', err);
                }
            }

            usbDevice = null;
            usbInterface = null;
            usbEndpointIn = null;
            usbEndpointOut = null;

            updateUI(false);
            addMessage('🔌 تم قطع الاتصال', 'system');
        }

        async function listPorts() {
            try {
                if (!navigator.usb) {
                    addMessage('❌ WebUSB غير مدعوم', 'error');
                    return;
                }
                const devices = await navigator.usb.getDevices();
                if (devices.length === 0) {
                    addMessage('📋 لا توجد أجهزة USB مصرح بها', 'system');
                    addMessage('💡 اضغط "اتصال" لاختيار جهاز', 'system');
                } else {
                    addMessage('📋 الأجهزة المصرح بها:', 'system');
                    devices.forEach((d, i) => {
                        addMessage('  ' + (i+1) + '. ' + (d.productName || 'جهاز غير معروف'), 'system');
                    });
                }
            } catch (err) {
                addMessage('❌ خطأ في جلب المنافذ: ' + err.message, 'error');
            }
        }

        // ======== Events ========
        connectBtn.addEventListener('click', connectUSB);
        disconnectBtn.addEventListener('click', disconnectUSB);
        listBtn.addEventListener('click', listPorts);
        sendBtn.addEventListener('click', sendMessage);

        msgInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const maxSize = 5 * 1024 * 1024; // 5MB
                if (file.size > maxSize) {
                    addMessage('⚠️ حجم الملف كبير جداً (أقصى 5 ميجابايت)', 'error');
                    this.value = '';
                    return;
                }
                selectedFile = file;
                fileName.textContent = '📎 ' + file.name + ' (' + (file.size / 1024).toFixed(0) + 'KB)';
                fileName.style.color = 'rgba(255,255,255,0.7)';
                clearFileBtn.classList.add('show');
                addMessage('📎 تم اختيار: ' + file.name, 'system');
            }
        });

        clearFileBtn.addEventListener('click', function() {
            selectedFile = null;
            fileInput.value = '';
            fileName.textContent = 'لا يوجد ملف';
            fileName.style.color = 'rgba(255,255,255,0.4)';
            this.classList.remove('show');
        });

        // ======== Init ========
        addMessage('🚀 شات USB حقيقي جاهز', 'system');
        addMessage('💡 اضغط "اتصال" لبدء المحادثة', 'system');
        setStatus('غير متصل', 'disconnected');

        if (!navigator.usb) {
            addMessage('⚠️ متصفحك لا يدعم WebUSB', 'error');
            addMessage('💡 استخدم Chrome أو Edge الإصدار 89+', 'system');
            addMessage('💡 أو فعّل chrome://flags/#enable-experimental-web-platform-features', 'system');
        }

        console.log('🔌 USB Chat App v3.0 - WebUSB');
        console.log('✅ جاهز للاستخدام');

    })();
</script>
