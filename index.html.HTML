<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إغلاق اللعبة - BUGBUM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1a, #0a1a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* خلفية متحركة نجوم */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
        }

        .card {
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 50px 40px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,255,0.2);
            animation: fadeInScale 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(0, 255, 255, 0.4);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px cyan);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #FF9966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .message {
            font-size: 18px;
            color: #ccddee;
            margin-bottom: 35px;
            line-height: 1.6;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        .btn-return {
            background: linear-gradient(90deg, #1E3A5F, #0D2B45);
            border: none;
            padding: 14px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            font-family: monospace;
            color: #FFD966;
            text-shadow: 0 1px 2px black;
            box-shadow: 0 8px 0 #0A1A2A;
            transition: 0.08s linear;
            width: 80%;
            max-width: 280px;
            margin-top: 10px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-return:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #0A1A2A;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #88aaff;
            opacity: 0.7;
        }

        /* تأثيرات سحرية */
        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,255,0.2), transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 550px) {
            .card { padding: 35px 25px; }
            h1 { font-size: 32px; }
            .message { font-size: 16px; }
            .btn-return { font-size: 18px; padding: 12px 20px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🎮🚫</div>
    <h1>تم إغلاق اللعبة</h1>
    <div class="message">
        لقد قمت بإغلاق BUGBUM. نشكرك على وقتك الجميل.<br>
        نتمنى رؤيتك قريبًا في مغامرة جديدة.
    </div>
    <button class="btn-return" id="returnBtn">↩️ رجوع</button>
    <div class="footer">BUGBUM ❤️ — كل التوفيق</div>
</div>

<script>
    // زر الرجوع: يودي للصفحة السابقة إذا وجدت، وإلا يغلق النافذة (في تطبيقات الويب المخصصة)
    document.getElementById('returnBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer !== "") {
            window.location.href = document.referrer;
        } else if (window.history.length > 1) {
            window.history.back();
        } else {
            // رسالة تنبيه لطيفة
            alert("لا توجد صفحة سابقة للعودة إليها.\nيمكنك إغلاق هذه الصفحة يدويًا.");
        }
    });

    // تأثير متابعة الماوس (سحري)
    document.addEventListener('mousemove', (e) => {
        const glow = document.querySelector('.glow');
        if (!glow) {
            const newGlow = document.createElement('div');
            newGlow.classList.add('glow');
            document.body.appendChild(newGlow);
        }
        const glowDiv = document.querySelector('.glow');
        if (glowDiv) {
            glowDiv.style.left = e.clientX - 100 + 'px';
            glowDiv.style.top = e.clientY - 100 + 'px';
        }
    });
</script>
</body>
</html>
