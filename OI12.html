<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI12 — منصة نشر المواقع</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
  }
  .header {
    background: #fff;
    border-bottom: 1px solid #e5e5e7;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: #1d1d1f;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: #0071e3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .header-actions {
    display: flex;
    gap: 10px;
  }
  .btn-header {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-publish {
    background: #0071e3;
    color: #fff;
  }
  .btn-publish:hover { background: #0077ed; }
  .btn-reports {
    background: #ff9500;
    color: #fff;
    display: none;
    position: relative;
  }
  .btn-reports.show { display: flex; }
  .btn-reports:hover { background: #ffaa33; }
  .btn-admin {
    background: none;
    border: 1px solid #d2d2d7;
    color: #1d1d1f;
  }
  .btn-admin:hover { background: #f5f5f7; }
  .btn-admin.active {
    background: #ff3b30;
    color: #fff;
    border-color: #ff3b30;
  }
  .btn-eve {
    background: #5856d6;
    color: #fff;
    display: flex;
  }
  .btn-eve:hover { background: #6b69e0; }
  .report-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ff3b30;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    max-width: 600px;
    margin: 0 auto;
  }
  .hero h1 {
    font-size: 32px;
    font-weight: 700;
    color: #1d1d1f;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .hero p {
    font-size: 17px;
    color: #86868b;
    line-height: 1.5;
  }

  .sites-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .sites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .site-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #e5e5e7;
    transition: box-shadow 0.2s, transform 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
  }
  .site-card:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .site-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #f5f5f7;
    display: block;
  }
  .site-image.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .site-image.placeholder svg {
    width: 48px;
    height: 48px;
    color: #c7c7cc;
  }
  .site-info {
    padding: 16px;
  }
  .site-name {
    font-size: 16px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .site-url {
    font-size: 13px;
    color: #86868b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: ltr;
    text-align: right;
  }
  .site-author {
    font-size: 12px;
    color: #3399FF;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .site-author svg {
    width: 12px;
    height: 12px;
  }
  .site-actions {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
  }
  .site-actions button {
    flex: 1;
    padding: 8px;
    border: 1px solid #e5e5e7;
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    color: #1d1d1f;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .site-actions button:hover { background: #f5f5f7; }
  .site-actions button.delete {
    color: #ff3b30;
    display: none;
  }
  .site-actions button.delete.show { display: flex; }
  .site-actions button.report {
    color: #ff9500;
  }
  .site-actions button.report:hover { background: #fff8f0; }
  .site-actions button svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #86868b;
  }
  .empty-state .icon {
    width: 80px;
    height: 80px;
    background: #fff;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    border: 1px solid #e5e5e7;
  }
  .empty-state .icon svg {
    width: 36px;
    height: 36px;
    color: #86868b;
  }
  .empty-state h3 {
    font-size: 20px;
    color: #1d1d1f;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .empty-state p { font-size: 15px; }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 600px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .modal-header h2 {
    font-size: 20px;
    font-weight: 700;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-header h2 svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: #86868b;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .modal-close:hover { background: #f5f5f7; }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #1d1d1f;
    margin-bottom: 8px;
  }
  .form-group input[type="text"],
  .form-group input[type="url"],
  .form-group input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    font-size: 15px;
    color: #1d1d1f;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: #0071e3;
    box-shadow: 0 0 0 4px rgba(0,113,227,0.1);
  }
  .form-group input::placeholder { color: #c7c7cc; }

  .file-upload {
    position: relative;
    display: block;
    width: 100%;
    padding: 40px 20px;
    border: 2px dashed #d2d2d7;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #fafafa;
  }
  .file-upload:hover {
    border-color: #0071e3;
    background: #f0f7ff;
  }
  .file-upload input[type="file"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .file-upload-icon {
    margin-bottom: 8px;
  }
  .file-upload-icon svg {
    width: 32px;
    height: 32px;
    color: #86868b;
  }
  .file-upload-text {
    font-size: 14px;
    color: #86868b;
  }
  .file-upload-name {
    font-size: 13px;
    color: #0071e3;
    margin-top: 6px;
    font-weight: 500;
  }
  .preview-img {
    max-width: 100%;
    max-height: 120px;
    border-radius: 8px;
    margin-top: 10px;
    display: none;
  }
  .preview-img.show { display: block; }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
  }
  .btn-cancel {
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .btn-cancel:hover { background: #e5e5e7; }
  .btn-submit {
    background: #0071e3;
    color: #fff;
  }
  .btn-submit:hover { background: #0077ed; }
  .btn-danger {
    background: #ff3b30;
    color: #fff;
  }
  .btn-danger:hover { background: #ff5549; }

  .footer {
    text-align: center;
    padding: 30px;
    color: #86868b;
    font-size: 13px;
    border-top: 1px solid #e5e5e7;
    background: #fff;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1d1d1f;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .admin-badge {
    display: inline-block;
    background: #ff3b30;
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* Reports List */
  .reports-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .report-item {
    background: #fff8f0;
    border: 1px solid #ffddb0;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .report-item.resolved {
    background: #f0fff4;
    border-color: #90ee90;
    opacity: 0.7;
  }
  .report-info {
    flex: 1;
    min-width: 0;
  }
  .report-site-name {
    font-weight: 600;
    font-size: 15px;
    color: #1d1d1f;
    margin-bottom: 4px;
  }
  .report-site-url {
    font-size: 13px;
    color: #86868b;
    direction: ltr;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .report-date {
    font-size: 12px;
    color: #ff9500;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .report-date svg {
    width: 12px;
    height: 12px;
  }
  .report-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .report-actions button {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .report-actions button svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .btn-view {
    background: #0071e3;
    color: #fff;
  }
  .btn-view:hover { background: #0077ed; }
  .btn-delete-report {
    background: #ff3b30;
    color: #fff;
  }
  .btn-delete-report:hover { background: #ff5549; }
  .btn-resolve {
    background: #34c759;
    color: #fff;
  }
  .btn-resolve:hover { background: #30d158; }
  .empty-reports {
    text-align: center;
    padding: 40px;
    color: #86868b;
  }
  .empty-reports .icon {
    margin-bottom: 12px;
  }
  .empty-reports .icon svg {
    width: 48px;
    height: 48px;
    color: #86868b;
  }
</style>
<base target="_blank">
</head>
<body>

<header class="header">
  <div class="logo">
    OI
    <div class="logo-icon">12</div>
  </div>
  <div class="header-actions">
    <button class="btn-header btn-publish" onclick="openPublishModal()">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      نشر موقع
    </button>
    <button class="btn-header btn-reports" id="reportsBtn" onclick="openReportsModal()">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      سلة البلاغات
      <span class="report-badge" id="reportCountBadge" style="display:none;">0</span>
    </button>
    <button class="btn-header btn-admin" id="adminBtn" onclick="toggleAdmin()">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      مشرف
    </button>
    <button class="btn-header btn-eve" onclick="openEve()">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="19" cy="13" r="1"/></svg>
      EVE
    </button>
  </div>
</header>

<section class="hero">
  <h1>منصة نشر المواقع</h1>
  <p>انشر موقعك مجاناً وشاركه مع العالم.</p>
</section>

<main class="sites-container">
  <div class="sites-grid" id="sitesGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </div>
    <h3>لا يوجد مواقع بعد</h3>
    <p>كن أول من ينشر موقع!</p>
  </div>
</main>

<footer class="footer">
  OI12 — منصة نشر المواقع المفتوحة
</footer>

<!-- Publish Modal -->
<div class="modal-overlay" id="publishModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        نشر موقع جديد
      </h2>
      <button class="modal-close" onclick="closePublishModal()">&times;</button>
    </div>
    <div class="form-group">
      <label>رابط الموقع *</label>
      <input type="url" id="pubUrl" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label>اسم الموقع *</label>
      <input type="text" id="pubName" placeholder="اسم موقعك">
    </div>
    <div class="form-group">
      <label>اسمك (المطور)</label>
      <input type="text" id="pubAuthor" placeholder="اسمك أو اسم فريقك">
    </div>
    <div class="form-group">
      <label>صورة الموقع (من جهازك)</label>
      <div class="file-upload" id="fileUploadBox">
        <input type="file" id="pubImageFile" accept="image/*" onchange="handleImageSelect(event)">
        <div class="file-upload-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="file-upload-text">اضغط هنا أو اسحب صورة</div>
        <div class="file-upload-name" id="fileName"></div>
        <img class="preview-img" id="previewImg" alt="معاينة">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closePublishModal()">إلغاء</button>
      <button class="btn btn-submit" onclick="publishSite()">نشر</button>
    </div>
  </div>
</div>

<!-- Admin Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        دخول المشرف
      </h2>
      <button class="modal-close" onclick="closeLoginModal()">&times;</button>
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور">
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="closeLoginModal()">إلغاء</button>
      <button class="btn btn-submit" onclick="checkPassword()">دخول</button>
    </div>
  </div>
</div>

<!-- Reports Modal (Admin Only) -->
<div class="modal-overlay" id="reportsModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        سلة البلاغات
      </h2>
      <button class="modal-close" onclick="closeReportsModal()">&times;</button>
    </div>
    <div id="reportsContent">
      <div class="empty-reports">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <p>لا يوجد بلاغات حالياً</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====== ENCRYPTED PASSWORD HASH (SHA-256) ======
  const ADMIN_HASH = 'bb28819a7080ee15e07cf0a06836c08288e3555bb4f7dd5d78c1ed733338dc5fbad9f1875731a6dd758f1ddfdfcab3b4d3ff5fe6ad03801369c2c555986fc9b4';

  // ====== STATE ======
  let sites = JSON.parse(localStorage.getItem('oi12_sites')) || [];
  let reports = JSON.parse(localStorage.getItem('oi12_reports')) || [];
  let isAdmin = false;
  let currentImageBase64 = '';

  // ====== CRYPTO ======
  async function sha512(message) {
    const encoder = new TextEncoder();
    const data = encoder.encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-512', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ====== FUNCTIONS ======
  function saveSites() {
    localStorage.setItem('oi12_sites', JSON.stringify(sites));
  }

  function saveReports() {
    localStorage.setItem('oi12_reports', JSON.stringify(reports));
    updateReportBadge();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(e) {
      currentImageBase64 = e.target.result;
      const preview = document.getElementById('previewImg');
      preview.src = currentImageBase64;
      preview.classList.add('show');
    };
    reader.readAsDataURL(file);
  }

  function updateReportBadge() {
    const badge = document.getElementById('reportCountBadge');
    const btn = document.getElementById('reportsBtn');
    const unresolved = reports.filter(r => !r.resolved).length;

    if (isAdmin && unresolved > 0) {
      badge.textContent = unresolved;
      badge.style.display = 'flex';
      btn.classList.add('show');
    } else {
      badge.style.display = 'none';
      if (!isAdmin) btn.classList.remove('show');
    }
  }

  function render() {
    const grid = document.getElementById('sitesGrid');
    const empty = document.getElementById('emptyState');

    if (sites.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    grid.style.display = 'grid';
    empty.style.display = 'none';

    grid.innerHTML = sites.map((s, i) => {
      const imgHtml = s.image 
        ? `<img class="site-image" src="${s.image}" alt="${s.name}">`
        : `<div class="site-image placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>`;

      const adminBadge = isAdmin ? '<span class="admin-badge">مشرف</span>' : '';

      const actionButtons = isAdmin 
        ? `<button class="delete show" onclick="deleteSite(${i}); event.stopPropagation();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>حذف</button>`
        : `<button class="report" onclick="reportSite(${i}); event.stopPropagation();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>إبلاغ</button>`;

      return `
        <div class="site-card" onclick="window.open('${s.url}', '_blank')">
          ${imgHtml}
          <div class="site-info">
            <div class="site-name">${adminBadge}${s.name}</div>
            <div class="site-url">${s.url}</div>
            ${s.author ? `<div class="site-author"><svg viewBox="0 0 24 24" fill="none" stroke="#3399FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${s.author}</div>` : ''}
          </div>
          <div class="site-actions">
            <button onclick="copyUrl('${s.url}'); event.stopPropagation();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>نسخ</button>
            ${actionButtons}
          </div>
        </div>
      `;
    }).join('');
  }

  // ====== PUBLISH (ANYONE CAN) ======
  function openPublishModal() {
    document.getElementById('publishModal').classList.add('active');
    document.getElementById('pubUrl').focus();
  }

  function closePublishModal() {
    document.getElementById('publishModal').classList.remove('active');
    document.getElementById('pubUrl').value = '';
    document.getElementById('pubName').value = '';
    document.getElementById('pubAuthor').value = '';
    document.getElementById('pubImageFile').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('previewImg').src = '';
    document.getElementById('previewImg').classList.remove('show');
    currentImageBase64 = '';
  }

  function publishSite() {
    const url = document.getElementById('pubUrl').value.trim();
    const name = document.getElementById('pubName').value.trim();
    const author = document.getElementById('pubAuthor').value.trim();

    if (!url || !name) {
      showToast('الرابط والاسم مطلوبان');
      return;
    }

    let fixedUrl = url;
    if (!fixedUrl.startsWith('http://') && !fixedUrl.startsWith('https://')) {
      fixedUrl = 'https://' + fixedUrl;
    }

    sites.push({
      id: Date.now(),
      url: fixedUrl,
      name,
      author: author || 'مجهول',
      image: currentImageBase64
    });

    saveSites();
    render();
    closePublishModal();
    showToast('تم نشر موقعك!');
  }

  // ====== REPORTS ======
  function reportSite(index) {
    const site = sites[index];
    reports.push({
      id: Date.now(),
      siteIndex: index,
      siteName: site.name,
      siteUrl: site.url,
      date: new Date().toLocaleString('ar-SA'),
      resolved: false
    });
    saveReports();
    showToast('تم الإبلاغ — سيتم مراجعته');
  }

  function openReportsModal() {
    if (!isAdmin) {
      showToast('يحتاج دخول المشرف');
      return;
    }
    renderReportsList();
    document.getElementById('reportsModal').classList.add('active');
  }

  function closeReportsModal() {
    document.getElementById('reportsModal').classList.remove('active');
  }

  function renderReportsList() {
    const content = document.getElementById('reportsContent');

    if (reports.length === 0) {
      content.innerHTML = `
        <div class="empty-reports">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <p>لا يوجد بلاغات حالياً</p>
        </div>
      `;
      return;
    }

    content.innerHTML = `
      <div class="reports-list">
        ${reports.map((r, i) => `
          <div class="report-item ${r.resolved ? 'resolved' : ''}">
            <div class="report-info">
              <div class="report-site-name">${r.siteName}</div>
              <div class="report-site-url">${r.siteUrl}</div>
              <div class="report-date">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                ${r.date}
              </div>
            </div>
            <div class="report-actions">
              <button class="btn-view" onclick="viewReportedSite(${r.siteIndex})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                عرض
              </button>
              ${!r.resolved ? `<button class="btn-resolve" onclick="resolveReport(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>تم الحل</button>` : ''}
              <button class="btn-delete-report" onclick="deleteReportedSite(${i}, ${r.siteIndex})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>حذف الموقع</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function viewReportedSite(index) {
    if (sites[index]) {
      window.open(sites[index].url, '_blank');
    }
  }

  function resolveReport(index) {
    reports[index].resolved = true;
    saveReports();
    renderReportsList();
    showToast('تم تحديد البلاغ كمحلول');
  }

  function deleteReportedSite(reportIndex, siteIndex) {
    if (confirm('هل تريد حذف هذا الموقع نهائياً؟')) {
      if (sites[siteIndex]) {
        sites.splice(siteIndex, 1);
        saveSites();
      }
      reports.splice(reportIndex, 1);
      reports.forEach(r => {
        if (r.siteIndex > siteIndex) r.siteIndex--;
      });
      saveReports();
      renderReportsList();
      render();
      showToast('تم حذف الموقع');
    }
  }

  // ====== ADMIN ======
  function toggleAdmin() {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('adminBtn').innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>مشرف';
      document.getElementById('adminBtn').classList.remove('active');
      document.getElementById('reportsBtn').classList.remove('show');
      render();
      showToast('تم الخروج');
    } else {
      document.getElementById('loginModal').classList.add('active');
      document.getElementById('adminPassword').focus();
    }
  }

  async function checkPassword() {
    const input = document.getElementById('adminPassword').value;
    const inputHash = await sha512(input);

    if (inputHash === ADMIN_HASH) {
      isAdmin = true;
      document.getElementById('adminBtn').innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>خروج';
      document.getElementById('adminBtn').classList.add('active');
      document.getElementById('reportsBtn').classList.add('show');
      closeLoginModal();
      render();
      updateReportBadge();
      showToast('وضع المشرف مفعل');
    } else {
      showToast('كلمة المرور خاطئة');
      document.getElementById('adminPassword').value = '';
    }
  }

  function closeLoginModal() {
    document.getElementById('loginModal').classList.remove('active');
    document.getElementById('adminPassword').value = '';
  }

  // ====== ADMIN ACTIONS ======
  function deleteSite(index) {
    if (!isAdmin) {
      showToast('يحتاج دخول المشرف');
      return;
    }
    if (confirm('هل تريد حذف هذا الموقع؟')) {
      sites.splice(index, 1);
      reports.forEach(r => {
        if (r.siteIndex > index) r.siteIndex--;
        if (r.siteIndex === index) r.siteIndex = -1;
      });
      saveSites();
      saveReports();
      render();
      showToast('تم الحذف');
    }
  }

  function copyUrl(url) {
    navigator.clipboard.writeText(url).then(() => showToast('تم النسخ'));
  }

  function openEve() {
    window.open('https://fahome652-cell.github.io/bugbum12/EVE.html', '_blank');
  }

  // ====== EVENTS ======
  document.getElementById('publishModal').addEventListener('click', function(e) {
    if (e.target === this) closePublishModal();
  });

  document.getElementById('loginModal').addEventListener('click', function(e) {
    if (e.target === this) closeLoginModal();
  });

  document.getElementById('reportsModal').addEventListener('click', function(e) {
    if (e.target === this) closeReportsModal();
  });

  document.getElementById('adminPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkPassword();
  });

  document.getElementById('pubName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') publishSite();
  });

  // ====== INIT ======
  render();
  updateReportBadge();
</script>

</body>
</html>
