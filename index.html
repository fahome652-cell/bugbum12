        .start-box { background: linear-gradient(135deg, #1a1a3a, #0a0a2a); border: 3px solid cyan; border-radius: 30px; padding: 50px; text-align: center; box-shadow: 0 0 50px cyan; animation: glow 2s infinite; min-width: 350px; }
        @keyframes glow { 0% { box-shadow: 0 0 20px cyan; } 100% { box-shadow: 0 0 60px cyan; } }
        .start-box h1 { color: cyan; font-size: 52px; text-shadow: 0 0 10px cyan; }
        .start-box .version { color: #FFD700; font-size: 14px; margin: 10px 0 30px; }
        .start-box p { color: #fff; margin: 8px 0; font-size: 14px; }
        .btn { background: #8B5A2B; border: none; padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: monospace; color: #FFD700; text-shadow: 1px 1px 0 #4A2A0A; box-shadow: inset -2px -2px 0 #4A2A0A, inset 2px 2px 0 #C88A3A, 3px 3px 0 black; margin: 10px; width: 200px; }
        .btn:active { transform: translate(2px, 2px); }
        .settings-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 200; }
        .settings-box { background: linear-gradient(135deg, #1a1a3a, #0a0a2a); border: 3px solid cyan; border-radius: 30px; padding: 40px; text-align: center; min-width: 400px; max-height: 80vh; overflow-y: auto; }
        .settings-box h2 { color: cyan; font-size: 32px; margin-bottom: 25px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 8px; }
        .settings-row span { color: #fff; font-size: 14px; }
        .toggle-switch { width: 50px; height: 26px; background: #333; border-radius: 13px; cursor: pointer; position: relative; }
        .toggle-switch.active { background: #3399FF; }
        .toggle-switch::after { content: ''; width: 22px; height: 22px; background: #FFD700; border-radius: 50%; position: absolute; top: 2px; left: 3px; transition: 0.2s; }
        .toggle-switch.active::after { left: 25px; }
        .resolution-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .res-btn { background: #8B5A2B; border: none; padding: 8px; color: #FFD700; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 12px; }
        .mobile-controls { position: fixed; bottom: 20px; left: 0; right: 0; display: none; justify-content: center; gap: 20px; z-index: 60; padding: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .mobile-btn { width: 70px; height: 70px; background: rgba(139,90,43,0.9); border: 2px solid #FFD700; border-radius: 40px; display: flex; justify-content: center; align-items: center; font-size: 35px; font-weight: bold; color: #FFD700; cursor: pointer; box-shadow: 0 5px 0 #4A2A0A; transition: 0.05s linear; }
        .mobile-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4A2A0A; }
        .mobile-esc { position: fixed; top: 20px; right: 20px; width: 55px; height: 55px; background: #8B5A2B; border: 2px solid #FFD700; border-radius: 30px; display: none; justify-content: center; align-items: center; font-size: 20px; color: #FFD700; cursor: pointer; z-index: 70; font-family: monospace; box-shadow: 0 4px 0 #4A2A0A; }
        .mobile-esc:active { transform: translateY(2px); box-shadow: 0 2px 0 #4A2A0A; }
        .version-badge { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #FFD700; padding: 4px 10px; border-radius: 8px; font-size: 11px; z-index: 50; pointer-events: none; border-left: 2px solid cyan; }
        @media (max-width: 900px) { .mobile-controls { display: flex !important; } .mobile-esc { display: flex !important; } }

    </style>
