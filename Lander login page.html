```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>محرك لاندر الأنيق</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #010101;
    color: white;
    font-family: "Segoe UI", sans-serif;
}

/* الخلفية السوداء */
.scene {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.025),
            transparent 30%
        ),
        #010101;
}

/* هالة خلفية شديدة الخفة */
.scene::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,.018);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .35;
        transform: translate(-50%, -50%) scale(.9);
    }

    50% {
        opacity: .7;
        transform: translate(-50%, -50%) scale(1.1);
    }
}

/* الصفحة */
.container {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;

    animation: enter 1.3s cubic-bezier(.16,1,.3,1);
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(35px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* الشعار */
.mark {
    width: 54px;
    height: 54px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.8);
    font-size: 20px;
    font-weight: 700;

    margin-bottom: 28px;

    box-shadow:
        0 0 40px rgba(255,255,255,.025),
        inset 0 0 20px rgba(255,255,255,.025);

    animation:
        markEnter 1.2s ease,
        markFloat 5s ease-in-out infinite 1.2s;
}

@keyframes markEnter {
    from {
        opacity: 0;
        transform: scale(.6) rotate(-30deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes markFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* منطقة العنوان */
.title-area {
    text-align: center;
}

/*
   SVG يعطي إحساس أن الخط يتم رسمه
   ثم يختفي ويعاد رسمه باستمرار
*/
.title-svg {
    width: min(850px, 90vw);
    height: auto;
    overflow: visible;
}

.draw-title {
    font-family: "Aref Ruqaa", "Traditional Arabic", serif;

    font-size: 78px;
    font-weight: 700;

    fill: rgba(255,255,255,.95);

    stroke: rgba(255,255,255,.9);
    stroke-width: 1.2;

    paint-order: stroke fill;

    stroke-dasharray: 900;
    stroke-dashoffset: 900;

    animation:
        draw 4.8s ease-in-out infinite;
}

@keyframes draw {

    /* يبدأ فارغ */
    0% {
        stroke-dashoffset: 900;
        fill-opacity: 0;
        opacity: 0;
    }

    /* يبدأ الرسم */
    12% {
        stroke-dashoffset: 700;
        fill-opacity: .08;
        opacity: 1;
    }

    /* الكتابة اكتملت */
    45% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        opacity: 1;
    }

    /* تبقى ظاهرة */
    65% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        opacity: 1;
    }

    /* تختفي تدريجياً */
    88% {
        stroke-dashoffset: 0;
        fill-opacity: 0;
        opacity: 0;
    }

    /* إعادة */
    100% {
        stroke-dashoffset: 900;
        fill-opacity: 0;
        opacity: 0;
    }
}

/* السطر الصغير */
.subtitle {
    margin-top: -4px;

    color: #666;

    font-family: "Aref Ruqaa", "Traditional Arabic", serif;
    font-size: 23px;

    letter-spacing: 1px;

    opacity: 0;
    animation:
        subtitleAnimation 4.8s ease-in-out infinite;
}

@keyframes subtitleAnimation {

    0% {
        opacity: 0;
        transform: translateY(8px);
    }

    25% {
        opacity: 0;
    }

    45% {
        opacity: .8;
        transform: translateY(0);
    }

    65% {
        opacity: .8;
    }

    88% {
        opacity: 0;
        transform: translateY(-5px);
    }

    100% {
        opacity: 0;
    }
}

/* زر الفتح */
.open-button {
    position: relative;

    width: 104px;
    height: 104px;

    margin-top: 55px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    color: #fff;

    background: #030303;

    border: 1px solid rgba(255,255,255,.28);

    font-family: "Aref Ruqaa", "Traditional Arabic", serif;
    font-size: 25px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.025),
        0 15px 60px rgba(0,0,0,.8),
        inset 0 0 25px rgba(255,255,255,.025);

    transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        border-color .35s ease,
        box-shadow .35s ease;
}

/* الحلقة الخارجية */
.open-button::before {
    content: "";

    position: absolute;

    inset: -9px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.07);

    border-top-color: rgba(255,255,255,.55);

    animation: rotate 5s linear infinite;
}

/* هالة الزر */
.open-button::after {
    content: "";

    position: absolute;

    inset: -20px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.025);

    opacity: .6;

    transition: all .4s ease;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

.open-button:hover {
    transform: scale(1.08);

    border-color: rgba(255,255,255,.7);

    box-shadow:
        0 0 45px rgba(255,255,255,.08),
        0 20px 70px rgba(0,0,0,.9),
        inset 0 0 30px rgba(255,255,255,.04);
}

.open-button:hover::after {
    inset: -27px;
    opacity: 1;
}

.open-button:active {
    transform: scale(.94);
}

/* سهم صغير */
.arrow {
    position: absolute;

    bottom: -42px;

    font-family: Arial, sans-serif;
    font-size: 17px;

    color: #444;

    animation: arrowMove 2s ease-in-out infinite;
}

@keyframes arrowMove {

    0%,100% {
        opacity: .25;
        transform: translateY(0);
    }

    50% {
        opacity: .8;
        transform: translateY(5px);
    }
}

/* خط سفلي */
.bottom-line {
    position: absolute;

    bottom: 28px;

    color: #222;

    font-size: 10px;
    letter-spacing: 4px;

    user-select: none;
}

/* الجوال */
@media (max-width: 600px) {

    .mark {
        width: 46px;
        height: 46px;
        font-size: 17px;
    }

    .draw-title {
        font-size: 48px;
    }

    .subtitle {
        font-size: 19px;
    }

    .open-button {
        width: 92px;
        height: 92px;
        font-size: 22px;
        margin-top: 45px;
    }
}

/* تقليل الحركة إذا طلب الجهاز ذلك */
@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="scene"></div>

<main class="container">

    <div class="mark">L</div>

    <div class="title-area">

        <svg
            class="title-svg"
            viewBox="0 0 900 130"
            aria-label="محرك لاندر الأنيق"
        >
            <text
                class="draw-title"
                x="450"
                y="88"
                text-anchor="middle"
                direction="rtl"
            >
                محرك لاندر الأنيق
            </text>
        </svg>

        <div class="subtitle">
            خفيف للأجهزة
        </div>

    </div>

    <a
        class="open-button"
        href="https://lender-digital.vercel.app/Lender.html"
        aria-label="فتح محرك لاندر"
    >
        فتح
        <span class="arrow">↓</span>
    </a>

</main>

<div class="bottom-line">
    LENDER DIGITAL
</div>

</body>
</html>
```
